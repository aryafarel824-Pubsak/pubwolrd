<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vokabeln — Latihan Kosakata Jerman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#12151a;
    --surface:#1a1e25;
    --surface-2:#232830;
    --line:#2a2f38;
    --text:#eceef1;
    --text-muted:#868d98;
    --accent:#5089b5;
    --accent-dim:#5089b533;
    --correct:#5fa776;
    --correct-dim:#5fa77622;
    --wrong:#c0604a;
    --wrong-dim:#c0604a22;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding:0;
  }
  .app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px 20px 28px;
  }
  @media (min-width:640px){
    .app{ padding:40px 32px 40px; }
    body{ align-items:flex-start; }
    .app{ margin-top:24px; border:1px solid var(--line); border-radius:20px; min-height:auto; box-shadow:0 24px 60px -20px #00000080; }
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .wordmark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .wordmark .dot{ color:var(--accent); }
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:4px 9px;
    border-radius:20px;
    letter-spacing:0.02em;
  }

  /* ---------- autobahn progress strip ---------- */
  .route{
    position:relative;
    margin-bottom:34px;
  }
  .route-meta{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
    margin-bottom:8px;
  }
  .route-meta .pos{ color:var(--text); }
  .track{
    position:relative;
    height:5px;
    background:var(--surface-2);
    border-radius:3px;
    overflow:visible;
  }
  .track-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    background:linear-gradient(90deg,var(--accent),#6ea6cf);
    border-radius:3px;
    transition:width .35s ease;
  }
  .ticks{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
  }
  .tick{
    width:1px;
    background:var(--bg);
    opacity:.5;
  }

  /* ---------- card ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:280px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:40px 28px;
    text-align:center;
  }
  .card .artikel{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--accent);
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin-bottom:10px;
    min-height:16px;
  }
  .card .word{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(28px,7vw,40px);
    letter-spacing:-0.01em;
    word-break:break-word;
  }
  .card .plural{
    margin-top:10px;
    font-size:13px;
    color:var(--text-muted);
  }
  .feedback{
    margin-top:18px;
    font-size:14px;
    font-weight:500;
    min-height:20px;
  }
  .feedback.correct{ color:var(--correct); }
  .feedback.wrong{ color:var(--wrong); }

  /* ---------- bottom control row ---------- */
  .controls{
    display:grid;
    grid-template-columns:52px 1fr 52px;
    gap:10px;
    margin-top:24px;
  }
  .nav-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:14px;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    transition:background .15s, opacity .15s;
  }
  .nav-btn:active{ background:var(--line); }
  .nav-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .answer-input{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:14px;
    padding:0 16px;
    font-size:16px;
    font-family:'Inter',sans-serif;
    text-align:center;
    outline:none;
    transition:border-color .15s;
  }
  .answer-input:focus{ border-color:var(--accent); }
  .answer-input.correct{ border-color:var(--correct); background:var(--correct-dim); }
  .answer-input.wrong{ border-color:var(--wrong); background:var(--wrong-dim); }

  .hint-row{
    display:flex;
    justify-content:center;
    margin-top:14px;
  }
  .hint-btn{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .hint-btn:hover{ color:var(--accent); }

  /* ---------- setup screen ---------- */
  .setup{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px; }
  .setup h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:24px;
    margin:0 0 4px;
  }
  .setup p{ color:var(--text-muted); font-size:14px; line-height:1.6; margin:0; }
  .setup input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:12px;
    padding:14px 16px;
    font-size:14px;
    font-family:'IBM Plex Mono',monospace;
    outline:none;
  }
  .setup input:focus{ border-color:var(--accent); }
  .primary-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:opacity .15s;
  }
  .primary-btn:hover{ opacity:.9; }
  .primary-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .ghost-btn{
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    font-size:14px;
    font-weight:500;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .ghost-btn:hover{ background:var(--surface-2); }
  .error-box{
    background:var(--wrong-dim);
    border:1px solid var(--wrong);
    color:var(--wrong);
    border-radius:10px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.5;
  }
  .status-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
    text-align:center;
  }

  /* ---------- result screen ---------- */
  .result{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:22px; }
  .score-block{ text-align:center; }
  .score-big{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:56px;
    line-height:1;
  }
  .score-big span{ color:var(--text-muted); font-size:28px; }
  .score-label{ color:var(--text-muted); font-size:13px; margin-top:6px; }
  .result-actions{ display:flex; flex-direction:column; gap:10px; }
  .review{
    max-height:220px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding-right:2px;
  }
  .review-item{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:3px solid var(--wrong);
    border-radius:10px;
    padding:10px 14px;
    font-size:13px;
  }
  .review-item .rw{ font-weight:600; font-family:'Space Grotesk',sans-serif; }
  .review-item .ra{ color:var(--wrong); margin-top:3px; }
  .review-item .rc{ color:var(--correct); }
  .review-title{ font-size:12px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.04em; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     PERSISTENT STORAGE HELPERS (window.storage — no localStorage)
     ============================================================ */
  async function saveConfig(cfg){
    try{ await window.storage.set('vokabeln:config', JSON.stringify(cfg)); }catch(e){ console.error('save config failed', e); }
  }
  async function loadConfig(){
    try{
      const r = await window.storage.get('vokabeln:config');
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  async function loadStats(){
    try{
      const r = await window.storage.get('vokabeln:stats');
      return r ? JSON.parse(r.value) : { roundsCompleted:0, totalAnswered:0, totalCorrect:0 };
    }catch(e){ return { roundsCompleted:0, totalAnswered:0, totalCorrect:0 }; }
  }
  async function saveStats(stats){
    try{ await window.storage.set('vokabeln:stats', JSON.stringify(stats)); }catch(e){ console.error('save stats failed', e); }
  }

  /* ============================================================
     STATE
     ============================================================ */
  const state = {
    screen: 'loading',      // loading | setup | quiz | result
    sheetUrl: null,
    pool: [],                // full validated vocab pool [{artikel, worter, plural, arti}]
    round: {
      type: 'random',        // 'random' | 'retry'
      items: [],              // locked question list for this round
      index: 0,
      userInputs: [],          // string per question
      checked: [],              // bool per question: has been checked
      correctFlags: []           // bool per question
    },
    hintUsed: false,
    loadError: null
  };

  const root = document.getElementById('app');

  /* ============================================================
     CSV PARSING — ROBUST MULTI-BLOCK EXTRACTION
     Handles a sheet that may contain several stacked tables
     (e.g. daily-added sections), each with its own header row
     naming the columns we need. Columns are matched BY NAME,
     never by fixed position, so reordering or new sections
     added later won't break matching. Word <-> meaning pairs
     are only ever read from the same row, so mismatched
     art artikel/word/meaning across rows is not possible.
     ============================================================ */
  function normalizeHeaderCell(cell){
    return (cell || '').toString().trim().toLowerCase();
  }

  function classifyHeader(cell){
    const c = normalizeHeaderCell(cell);
    if(!c) return null;
    if(c.indexOf('artike') !== -1) return 'artikel';
    if(c.indexOf('worter') !== -1 || c.indexOf('wörter') !== -1 || c.indexOf('wort') !== -1) return 'worter';
    if(c.indexOf('plural') !== -1) return 'plural';
    if(c.indexOf('arti') !== -1) return 'arti'; // checked after 'artike' so it won't collide
    return null;
  }

  function parseVocabFromRows(rows){
    const pool = [];
    let colMap = null; // { artikel: idx, worter: idx, plural: idx, arti: idx }

    for(let r = 0; r < rows.length; r++){
      const row = rows[r];
      if(!row || row.every(c => !c || !c.toString().trim())) continue; // skip blank rows

      // does this row look like a header row? (contains worter + arti at least)
      const found = {};
      row.forEach((cell, idx) => {
        const kind = classifyHeader(cell);
        if(kind && found[kind] === undefined) found[kind] = idx;
      });
      if(found.worter !== undefined && found.arti !== undefined){
        colMap = found; // new block header found — switch mapping
        continue;
      }

      // data row — only usable if we have a column map with worter+arti at minimum
      if(colMap){
        const worter = colMap.worter !== undefined ? (row[colMap.worter] || '').toString().trim() : '';
        const arti   = colMap.arti   !== undefined ? (row[colMap.arti]   || '').toString().trim() : '';
        const artikel= colMap.artikel!== undefined ? (row[colMap.artikel]|| '').toString().trim() : '';
        const plural = colMap.plural !== undefined ? (row[colMap.plural] || '').toString().trim() : '';
        if(worter && arti){
          pool.push({ artikel, worter, plural, arti });
        }
      }
    }
    return pool;
  }

  function toCsvUrl(input){
    let url = input.trim();

    // Already a usable export/publish link (covers /pub?output=csv,
    // /pub?output=tsv, /export?format=csv, /pubhtml, etc.) — leave it
    // exactly as pasted. Rewriting these was the bug: publish-to-web
    // links use a "/d/e/{ID}/pub..." path, which is structurally
    // different from a normal "/d/{ID}/edit" share link, and the old
    // regex below would wrongly chop it down to just "e".
    if(/\/pub\b|output=csv|output=tsv|format=csv/i.test(url)){
      // if someone published as pubhtml/tsv, coerce the output param to csv
      if(/\/pub\b/i.test(url) && !/output=csv/i.test(url)){
        if(/output=tsv/i.test(url)) url = url.replace(/output=tsv/i, 'output=csv');
        else if(/\?/.test(url)) url += '&output=csv';
        else url += '?output=csv';
      }
      return url;
    }

    // Plain share link (contains /d/{ID}/edit, no /d/e/ publish segment)
    // — convert to a CSV export link automatically.
    const m = url.match(/\/spreadsheets\/d\/(?!e\/)([a-zA-Z0-9-_]+)/);
    if(m){
      let gid = '0';
      const gidMatch = url.match(/[?&#]gid=([0-9]+)/);
      if(gidMatch) gid = gidMatch[1];
      return 'https://docs.google.com/spreadsheets/d/' + m[1] + '/export?format=csv&gid=' + gid;
    }

    return url; // fallback: use as-is
  }

  async function fetchPool(sheetUrl){
    const csvUrl = toCsvUrl(sheetUrl);
    const res = await fetch(csvUrl, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = Papa.parse(text.trim(), { skipEmptyLines: false });
    if(parsed.errors && parsed.errors.length && (!parsed.data || !parsed.data.length)){
      throw new Error('CSV tidak bisa dibaca');
    }
    const pool = parseVocabFromRows(parsed.data);
    if(!pool.length) throw new Error('Tidak ada kolom Worter & Arti yang cocok ditemukan di spreadsheet');
    return pool;
  }

  /* ============================================================
     QUIZ ENGINE
     ============================================================ */
  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startRound(type, items){
    state.round = {
      type,
      items,
      index: 0,
      userInputs: new Array(items.length).fill(''),
      checked: new Array(items.length).fill(false),
      correctFlags: new Array(items.length).fill(false)
    };
    state.hintUsed = false;
    state.screen = 'quiz';
    render();
  }

  function startRandomRound(){
    const size = Math.min(20, state.pool.length);
    const items = shuffle(state.pool).slice(0, size);
    startRound('random', items);
  }

  function startRetryRound(wrongItems){
    startRound('retry', shuffle(wrongItems));
  }

  function normalizeAnswer(s){
    return (s || '').toString().trim().replace(/\s+/g, ' ').toLowerCase();
  }

  function checkCurrent(){
    const i = state.round.index;
    const item = state.round.items[i];
    const isCorrect = normalizeAnswer(state.round.userInputs[i]) === normalizeAnswer(item.arti);
    state.round.checked[i] = true;
    state.round.correctFlags[i] = isCorrect;
    return isCorrect;
  }

  async function finishRound(){
    const stats = await loadStats();
    const correctCount = state.round.correctFlags.filter(Boolean).length;
    stats.roundsCompleted += 1;
    stats.totalAnswered += state.round.items.length;
    stats.totalCorrect += correctCount;
    await saveStats(stats);
    state.screen = 'result';
    render();
  }

  /* ============================================================
     RENDER — SCREENS
     ============================================================ */
  function render(){
    if(state.screen === 'loading') return renderLoading();
    if(state.screen === 'setup') return renderSetup();
    if(state.screen === 'quiz') return renderQuiz();
    if(state.screen === 'result') return renderResult();
  }

  function renderLoading(){
    root.innerHTML = `
      <div class="topbar">
        <div class="wordmark">Vokabeln<span class="dot">.</span></div>
      </div>
      <div class="setup">
        <p class="status-line">Memuat data…</p>
      </div>
    `;
  }

  function renderSetup(){
    const err = state.loadError ? `<div class="error-box">${state.loadError}</div>` : '';
    root.innerHTML = `
      <div class="topbar">
        <div class="wordmark">Vokabeln<span class="dot">.</span></div>
      </div>
      <div class="setup">
        <h1>Hubungkan spreadsheet</h1>
        <p>Tempel link Google Sheets kosakatamu (kolom: Artikel, Worter, Plural, Arti). Pastikan sharing diatur ke "Anyone with the link — Viewer".</p>
        <input id="sheet-url-input" type="text" placeholder="https://docs.google.com/spreadsheets/d/..." value="${state.sheetUrl ? state.sheetUrl.replace(/"/g,'&quot;') : ''}">
        ${err}
        <button class="primary-btn" id="connect-btn">Hubungkan &amp; Mulai</button>
      </div>
    `;
    document.getElementById('connect-btn').onclick = onConnect;
  }

  async function onConnect(){
    const input = document.getElementById('sheet-url-input');
    const url = input.value.trim();
    if(!url) return;
    state.screen = 'loading';
    render();
    try{
      const pool = await fetchPool(url);
      state.pool = pool;
      state.sheetUrl = url;
      state.loadError = null;
      await saveConfig({ sheetUrl: url });
      startRandomRound();
    }catch(e){
      state.loadError = 'Gagal memuat data: ' + e.message + '. Cek link dan pengaturan share-nya, lalu coba lagi.';
      state.screen = 'setup';
      render();
    }
  }

  function renderQuiz(){
    const { items, index, userInputs, checked, correctFlags } = state.round;
    const total = items.length;
    const item = items[index];
    const pct = ((index) / total) * 100;
    const isChecked = checked[index];
    const isLast = index === total - 1;

    let ticks = '';
    for(let t = 1; t < total; t++){ ticks += `<div class="tick" style="width:1px"></div>`; }

    const inputClass = isChecked ? (correctFlags[index] ? 'correct' : 'wrong') : '';
    const feedbackHtml = isChecked
      ? (correctFlags[index]
          ? `<div class="feedback correct">Benar ✓</div>`
          : `<div class="feedback wrong">Kurang tepat — jawaban: <strong>${item.arti}</strong></div>`)
      : `<div class="feedback"></div>`;

    root.innerHTML = `
      <div class="topbar">
        <div class="wordmark">Vokabeln<span class="dot">.</span></div>
        <div class="badge">${state.round.type === 'retry' ? 'ULANGI YANG SALAH' : 'SESI ACAK'}</div>
      </div>

      <div class="route">
        <div class="route-meta">
          <span class="pos">${String(index+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span>
          <span>KM ${index+1}</span>
        </div>
        <div class="track">
          <div class="track-fill" style="width:${pct}%"></div>
          <div class="ticks">${ticks}</div>
        </div>
      </div>

      <div class="stage">
        <div class="card">
          <div class="artikel" id="artikel-hint">${state.hintUsed ? (item.artikel || '&nbsp;') : '&nbsp;'}</div>
          <div class="word">${item.worter}</div>
          ${item.plural ? `<div class="plural">Plural: ${item.plural}</div>` : ''}
          ${feedbackHtml}
        </div>
        <div class="hint-row">
          <button class="hint-btn" id="hint-btn" ${state.hintUsed ? 'disabled' : ''}>${state.hintUsed ? '' : 'tampilkan artikel'}</button>
        </div>
      </div>

      <div class="controls">
        <button class="nav-btn" id="prev-btn" ${index === 0 ? 'disabled' : ''}>‹</button>
        <input class="answer-input ${inputClass}" id="answer-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="artinya…" value="${(userInputs[index]||'').replace(/"/g,'&quot;')}">
        <button class="nav-btn" id="next-btn">${isLast ? '✓' : '›'}</button>
      </div>
    `;

    const answerInput = document.getElementById('answer-input');
    answerInput.oninput = (e) => { state.round.userInputs[index] = e.target.value; };
    answerInput.onkeydown = (e) => { if(e.key === 'Enter') document.getElementById('next-btn').click(); };
    setTimeout(() => answerInput.focus(), 0);

    document.getElementById('prev-btn').onclick = () => {
      state.round.index = Math.max(0, index - 1);
      state.hintUsed = false;
      render();
    };

    document.getElementById('next-btn').onclick = async () => {
      if(!checked[index]) checkCurrent();
      if(isLast){
        await finishRound();
      }else{
        state.round.index = index + 1;
        state.hintUsed = false;
        render();
      }
    };

    const hintBtn = document.getElementById('hint-btn');
    if(hintBtn){
      hintBtn.onclick = () => { state.hintUsed = true; render(); };
    }
  }

  function renderResult(){
    const { items, correctFlags, userInputs } = state.round;
    const total = items.length;
    const correct = correctFlags.filter(Boolean).length;
    const wrongItems = items.filter((it, i) => !correctFlags[i]);

    let reviewHtml = '';
    if(wrongItems.length){
      reviewHtml = `<div class="review-title">Yang perlu diulang</div><div class="review">` +
        items.map((it, i) => {
          if(correctFlags[i]) return '';
          return `<div class="review-item">
            <div class="rw">${it.worter}</div>
            <div class="ra">jawabanmu: ${userInputs[i] ? userInputs[i] : '(kosong)'}</div>
            <div class="rc">seharusnya: ${it.arti}</div>
          </div>`;
        }).join('') +
      `</div>`;
    }

    root.innerHTML = `
      <div class="topbar">
        <div class="wordmark">Vokabeln<span class="dot">.</span></div>
        <div class="badge">SELESAI</div>
      </div>
      <div class="result">
        <div class="score-block">
          <div class="score-big">${correct}<span>/${total}</span></div>
          <div class="score-label">jawaban benar</div>
        </div>
        ${reviewHtml}
        <div class="result-actions">
          ${state.pool.length >= 1 ? `<button class="primary-btn" id="new-round-btn">20 Kata Baru</button>` : ''}
          ${wrongItems.length ? `<button class="ghost-btn" id="retry-wrong-btn">Ulangi yang Salah (${wrongItems.length})</button>` : ''}
          <button class="ghost-btn" id="done-btn">Selesai</button>
        </div>
      </div>
    `;

    const newRoundBtn = document.getElementById('new-round-btn');
    if(newRoundBtn) newRoundBtn.onclick = () => startRandomRound();

    const retryBtn = document.getElementById('retry-wrong-btn');
    if(retryBtn) retryBtn.onclick = () => startRetryRound(wrongItems);

    document.getElementById('done-btn').onclick = () => renderClosing(correct, total);
  }

  async function renderClosing(lastCorrect, lastTotal){
    const stats = await loadStats();
    root.innerHTML = `
      <div class="topbar">
        <div class="wordmark">Vokabeln<span class="dot">.</span></div>
      </div>
      <div class="result">
        <div class="score-block">
          <div class="score-big">${lastCorrect}<span>/${lastTotal}</span></div>
          <div class="score-label">sesi terakhir</div>
        </div>
        <div class="review-title">Statistik keseluruhan</div>
        <div class="review-item" style="border-left-color:var(--accent)">
          <div>Ronde selesai: <strong>${stats.roundsCompleted}</strong></div>
          <div>Total dijawab: <strong>${stats.totalAnswered}</strong></div>
          <div>Total benar: <strong>${stats.totalCorrect}</strong> (${stats.totalAnswered ? Math.round(100*stats.totalCorrect/stats.totalAnswered) : 0}%)</div>
        </div>
        <div class="result-actions">
          <button class="primary-btn" id="restart-btn">Mulai Sesi Baru</button>
        </div>
      </div>
    `;
    document.getElementById('restart-btn').onclick = () => startRandomRound();
  }

  /* ============================================================
     BOOT
     ============================================================ */
  async function boot(){
    state.screen = 'loading';
    render();
    const cfg = await loadConfig();
    if(cfg && cfg.sheetUrl){
      try{
        const pool = await fetchPool(cfg.sheetUrl);
        state.pool = pool;
        state.sheetUrl = cfg.sheetUrl;
        startRandomRound();
        return;
      }catch(e){
        state.loadError = 'Gagal memuat data tersimpan: ' + e.message + '. Masukkan link lagi.';
      }
    }
    state.screen = 'setup';
    render();
  }

  boot();
})();
</script>
</body>
</html>
